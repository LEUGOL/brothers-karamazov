<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17131D">

<link rel="icon" type="image/png" sizes="512x512" href="./brothers_karamazov_icon.png?v=2">
<link rel="shortcut icon" type="image/png" href="./brothers_karamazov_icon.png?v=2">

<title>BROTHERS KARAMAZOV | MY THEATRE RECORD</title>
<style>

*{box-sizing:border-box}

:root{
  --black:#E5DDE8;
  --deep:#1C1721;
  --purple:#38283E;
  --plum:#624568;
  --lilac:#A58BAA;
  --pale:#D8CDD9;
  --paper:#151219;
  --line:#403645;
  --muted:#9B8FA0;
  --white:#211B27;
}

body{
  margin:0;
  background-color:#17131B;
  background-image:
    linear-gradient(
      rgba(23,19,27,0.58),
      rgba(23,19,27,0.58)
    ),
    url("brothers-background.png");
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--black);
  font-family:"Noto Serif KR","Batang",serif;
  color-scheme:dark;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      rgba(18,14,23,0.94),
      rgba(53,37,61,0.90)
    );
  color:var(--pale);
  padding:55px 20px 48px;
  text-align:center;
  border-bottom:1px solid #745C7C;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}

.eyebrow{
  font:10px Arial,sans-serif;
  letter-spacing:4px;
  color:#B49AAF;
}

header h1{
  font-size:clamp(27px,5vw,43px);
  letter-spacing:3px;
  line-height:1.4;
  margin:22px 0 13px;
  color:#E8DFEA;
  font-weight:normal;
}

header p{
  font:10px Arial,sans-serif;
  letter-spacing:3px;
  color:#B9AABD;
  margin:0;
}

.container{
  width:min(100% - 28px,1050px);
  margin:28px auto 60px;
}

.section{
  background:rgba(33,27,39,0.76);
  border:1px solid var(--line);
  border-radius:3px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:18px;
}

.section-title h2{
  margin:0;
  font-size:17px;
  letter-spacing:1px;
  color:#D1BBD5;
}

.kicker{
  font:10px Arial,sans-serif;
  letter-spacing:2px;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.stat{
  background:#17121D;
  border:1px solid #403247;
  color:var(--pale);
  text-align:center;
  padding:19px 8px;
}

.stat small{
  display:block;
  font-size:11px;
  color:#B49AAF;
  margin-bottom:9px;
}

.stat strong{
  font-size:27px;
  font-weight:normal;
}

.stat span{font-size:12px}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.field{min-width:0}
.field.full{grid-column:1/-1}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  background:#17131C;
  border-radius:2px;
  padding:10px;
  color:var(--black);
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--lilac);
}

input::placeholder,textarea::placeholder{
  color:#776B7D;
}

textarea{resize:vertical;min-height:90px}

.btn{
  border:1px solid var(--plum);
  background:var(--purple);
  color:#F1EAF2;
  padding:10px 15px;
  font-size:12px;
  letter-spacing:.5px;
}

.btn:hover{
  background:#49334F;
}

.btn.light{
  background:transparent;
  color:#C8B7CC;
}

.btn.danger{
  border-color:#87515F;
  background:#70414F;
}

.btn.small{padding:6px 9px;font-size:11px}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.table-wrap{overflow-x:auto}

table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
  font-size:12px;
}

th{
  background:#19141F;
  color:#D8CDD9;
  font-weight:normal;
  padding:11px 8px;
  white-space:nowrap;
}

td{
  border-bottom:1px solid #39303F;
  padding:10px 8px;
  text-align:center;
  color:#D3C9D6;
}

tr.attended{
  background:#302437;
}

tr.attended td:first-child{
  border-left:3px solid var(--lilac);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px 10px;
  font-size:13px;
}

.schedule-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
/* PERFORMANCE SCHEDULE 내부 스크롤 */
.schedule-scroll{
  max-height:520px;
  overflow-y:auto;
  overflow-x:auto;
  border:1px solid rgba(91,73,99,.45);
  border-radius:6px;
}

/* 스크롤 중에도 표 제목 고정 */
.schedule-scroll thead th{
  position:sticky;
  top:0;
  z-index:2;
}

/* 스크롤바 디자인 */
.schedule-scroll::-webkit-scrollbar{
  width:7px;
  height:7px;
}

.schedule-scroll::-webkit-scrollbar-thumb{
  background:#695572;
  border-radius:10px;
}

.schedule-scroll::-webkit-scrollbar-track{
  background:rgba(23,19,29,.4);
}
.schedule-tools input{flex:1;min-width:130px}

.actor-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}


#castMembers{
  display:grid;
  grid-template-columns:repeat(6, minmax(125px, 1fr));
  gap:12px;
  overflow-x:auto;
  padding:8px 2px 14px;
}

.cast-role-card{
  min-width:125px;
  padding:12px;
  background:rgba(25,21,31,0.92);
  border:1px solid #45374B;
  border-radius:10px;
}

.cast-role-card strong{
  display:block;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid #514657;
  font-size:14px;
  color:#D0BBD5;
  letter-spacing:.5px;
}

.cast-actor-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.cast-actor{
  display:block;
  color:#B9AEBB;
  font-size:12px;
  line-height:1.5;
}

.cast-empty{
  color:#8F8493;
  font-size:12px;
}


.seat-summary{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.seat-item{
  border:1px solid var(--line);
  padding:12px;
  background:#19151F;
  font-size:12px;
  color:#D3C9D6;
}

.seat-item strong{color:#D0BBD5}


/* MY NOTES - DEEP PURPLE */

.notes-intro{
  color:#A99AAD;
  font-size:12px;
  line-height:1.7;
  margin:0 0 14px;
}

.notes-editor{
  background:rgba(48,36,56,.88);
  border:1px solid #594660;
  border-radius:8px;
  padding:14px;
  margin-bottom:16px;
}

.notes-editor label{
  display:block;
  color:#D8C5DC;
  font-size:12px;
  font-weight:bold;
  margin:12px 0 6px;
}

.notes-editor label:first-child{
  margin-top:0;
}

.notes-editor select,
.notes-editor textarea{
  width:100%;
  border:1px solid #594660;
  border-radius:6px;
  background:#19141F;
  color:#E5DDE8;
  padding:10px;
  font:inherit;
  font-size:13px;
}

.notes-editor select:focus,
.notes-editor textarea:focus{
  outline:none;
  border-color:#A58BAA;
  box-shadow:0 0 0 2px rgba(165,139,170,.15);
}

.notes-editor textarea{
  resize:vertical;
  line-height:1.7;
  min-height:75px;
}

.notes-editor textarea::placeholder{
  color:#776B7D;
}

.notes-save{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:1px solid #765B80;
  border-radius:6px;
  background:#49334F;
  color:#F1EAF2;
  font-size:13px;
}

.notes-save:hover{
  background:#594061;
}

.notes-list{
  display:grid;
  gap:10px;
}

.notes-list .note-card{
  background:rgba(25,21,31,.88);
  border:1px solid rgba(111,87,119,.65);
  border-radius:8px;
  padding:14px;
  color:#E5DDE8;
}

.note-date{
  font-size:12px;
  color:#A99AAD;
  margin-bottom:5px;
}

.note-title{
  font-size:14px;
  font-weight:bold;
  color:#D8C5DC;
}

.note-cast{
  font-size:11px;
  color:#A99AAD;
  margin-top:5px;
}

.note-stars{
  color:#B99BC2;
  letter-spacing:2px;
  margin-top:8px;
}

.note-content{
  font-size:13px;
  line-height:1.8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin-top:10px;
  color:#E5DDE8;
}

.note-label{
  font-size:11px;
  font-weight:bold;
  color:#B99BC2;
  margin-top:10px;
}

.note-actions{
  display:flex;
  gap:6px;
  margin-top:12px;
}

.note-actions button{
  font-size:11px;
  padding:7px 12px;
}

.note-empty{
  color:#A99AAD;
  text-align:center;
  padding:18px 5px;
  font-size:12px;
  line-height:1.7;
}

/* 별점 */
#noteRating{
  display:flex;
  justify-content:center;
  gap:3px;
  margin-top:4px;
}

#noteRating .rating-star{
  border:0;
  background:transparent;
  color:#65566B;
  font-size:23px;
  line-height:1;
  padding:3px 5px;
}

#noteRating .rating-star.selected{
  color:#C1A5C8;
}

/* MY NOTES 모바일 */
@media(max-width:600px){
  .notes-editor{
    padding:11px;
  }

  .notes-list .note-card{
    padding:11px;
  }

  .note-title{
    font-size:13px;
  }

  .note-content{
    font-size:12px;
  }
}

footer{
  text-align:center;
  padding:25px 10px;
  color:var(--muted);
  font:10px Arial,sans-serif;
  letter-spacing:2px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(33,27,39,0.88);
  padding:18px;
  align-items:center;
  justify-content:center;
}

.modal.show{display:flex}

.modal-box{
  position:relative;
  background:#1C1722;
  width:min(100%,520px);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border:1px solid #57445D;
}

@media(min-width:601px){
  .modal-box{
    width:min(95vw,1000px);
  }
}
  .close-btn{
  position:absolute;
  top:12px;
  right:12px;
}
.modal-title{
  color:#D8C6DC;
  font-size:18px;
  margin:0 0 18px;
}

.checkline{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  margin-top:12px;
}

.checkline input{width:auto}

/* SEAT MAP */

.seat-floor-tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.seat-floor-tabs button{
  flex:1;
  padding:11px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--black);
  font-size:13px;
}

.seat-floor-tabs button.active{
  background:var(--purple);
  color:var(--pale);
  border-color:var(--purple);
}

.seat-floor-heading{
  margin:20px 0 8px;
  padding-bottom:7px;
  border-bottom:1px solid var(--line);
  color:#CBB5D0;
  font-size:14px;
  letter-spacing:1px;
}

.seat-map-wrap{
  overflow-x:auto;
  padding:12px 4px;
  background:#17131D;
  border:1px solid #403645;
}

.seat-map{
  min-width:650px;
}

.seat-stage{
  width:90px;
  margin:0 auto 20px;
  padding:6px;
  text-align:center;
  border:1px solid #806B87;
  color:#C8B7CC;
  font:12px Arial,sans-serif;
  background:#211A27;
}

.seat-row{
  display:flex;
  align-items:center;
  gap:5px;
  margin:4px 0;
}

.seat-row-label{
  width:27px;
  flex-shrink:0;
  text-align:center;
  font:11px Arial,sans-serif;
  color:var(--muted);
}

.seat-blocks{
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);
  justify-content:stretch;
  column-gap:14px;
  min-width:0;
}

.seat-block{
  display:flex;
  gap:2px;
  min-width:0;
}

.seat-blocks > .seat-block:nth-child(1){
  justify-content:flex-end;
}

.seat-blocks > .seat-block:nth-child(2){
  justify-content:center;
}

.seat-blocks > .seat-block:nth-child(3){
  justify-content:flex-start;
}

.first-row-center{
  width:100%;
}

.seat-center-pair{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
}

.seat-group{
  display:flex;
  gap:2px;
}

.seat-cell{
  width:19px;
  height:19px;
  padding:0;
  flex-shrink:0;
  border:1px solid #625568;
  background:#302A35;
  border-radius:0;
  font-size:9px;
  line-height:17px;
  text-align:center;
  color:#D9D0DD;
  font-weight:600;
}

.seat-cell.selected{
  background:#795B80;
  border-color:#B49AAF;
  color:#FFF9FF;
}

.seat-cell:disabled{
  opacity:.65;
}

.seat-wheelchair{
  display:flex;
  justify-content:center;
  gap:5px;
  margin:8px 0 14px;
}

.seat-wheelchair button{
  width:32px;
  height:25px;
  border:1px solid #716078;
  background:#302638;
  color:#D8C9DC;
  font-size:9px;
  padding:0;
}

.seat-wheelchair button:disabled{
  opacity:.5;
}

.seat-block-name{
  text-align:center;
  font-size:9px;
  color:var(--muted);
  margin-bottom:5px;
}

.seat-selection{
  margin-top:14px;
  padding:12px;
  background:#17131D;
  border:1px solid var(--line);
  color:#D8C6DC;
  font-size:12px;
  text-align:center;
}

@media(max-width:600px){
  .seat-map-wrap{
    margin:0 -5px;
    padding:8px 4px;
  }

  .seat-cell{
    width:14px;
    height:14px;
    font-size:9px;
  }

  .seat-blocks{
    gap:5px;
  }
}
@media(max-width:600px){
  header{padding:38px 14px 30px}
  .container{width:calc(100% - 20px);margin-top:16px}
  .section{padding:16px;margin-bottom:12px}
  .stats{gap:6px}
  .stat{padding:15px 4px}
  .stat strong{font-size:23px}
  .stat small{font-size:10px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .actor-list{grid-template-columns:1fr}
  .seat-summary{grid-template-columns:1fr}
}

@media(min-width:601px){
  .seat-center-pair{
    padding-left:0;
    padding-right:0;
    gap:190px;
    justify-content:center;
  }
}
  @media(max-width:600px){
  .seat-center-pair{
    justify-content:center;
     gap:147px;
  }
}
@media(max-width:600px){
  body{
    background-color:#17131B;
    background-image:
      linear-gradient(
        rgba(23,19,27,0.45),
        rgba(23,19,27,0.45)
      ),
      url("./brothers-background.png") !important;
    background-size:100% auto !important;
    background-position:center top !important;
    background-repeat:repeat-y !important;
    background-attachment:scroll !important;
  }
}
  
#actorStats{

  grid-template-columns:repeat(6, minmax(125px, 1fr));
  gap:12px;
  overflow-x:auto;
  padding:8px 2px 14px;
}

#actorStats .actor-role-group{
  min-width:125px;
  padding:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid #403645;

#actorStats .actor-role-group h3{
  margin:0 0 12px;

#actorStats .actor-name{

/* MY NOTES STAR RATING */

function saveAll(){
  localStorage.setItem(STORAGE.schedules,JSON.stringify(schedules));
  localStorage.setItem(STORAGE.notes,JSON.stringify(notes));
}

function makeId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}


function formatDate(date){
  if(!date)return "";
  const d=new Date(date+"T00:00:00");
  return `${date.slice(5).replace("-",".")} (${["일","월","화","수","목","금","토"][d.getDay()]})`;
}


function getSchedule(id){
  return schedules.find(s=>s.id===id);
}
function renderNoteOptions(){
  const select = document.getElementById("noteSchedule");
  if(!select) return;

  const previousValue = select.value;

  const watchedSchedules = [...schedules]
    .filter(s => s.watched)
    .sort((a,b) =>
      (b.date+b.time).localeCompare(a.date+a.time)
    );

  select.innerHTML =
    `<option value="">관극한 공연을 선택해 주세요.</option>` +
    watchedSchedules.map(s => `
      <option value="${escapeHTML(s.id)}">
        ${escapeHTML(formatDate(s.date))} · ${escapeHTML(s.time||"")}
      </option>
    `).join("");

  if(watchedSchedules.some(s => s.id === previousValue)){
    select.value = previousValue;
  }
}

function renderActors(){

        schedule[roleKey] === actor

      const total = actorSchedules.length;
      const watched = actorSchedules.filter(schedule =>
        schedule.watched
      ).length;

      return `
        <div class="actor-row">
          <span class="actor-name">${escapeHTML(actor)}</span>
          <span class="actor-count">${watched}/${total}</span>
        </div>

        <h3>${member.role}</h3>
        <div class="actor-list">
          ${actors}
        </div>
      </div>

            ${s&&s.time?" · "+escapeHTML(s.time):""}
          </div>

          <div class="note-title">BROTHERS KARAMAZOV</div>

          ${cast?`<div class="note-cast">${escapeHTML(cast)}</div>`:""}

          <div class="note-stars">
            ${"★".repeat(rating)}${"☆".repeat(5-rating)}
          </div>

          ${scene?`
            <div class="note-label">기억하고 싶은 장면</div>
            <div class="note-content">${escapeHTML(scene)}</div>
          `:""}

          ${memo?`
            <div class="note-label">오늘의 감상</div>
            <div class="note-content">${escapeHTML(memo)}</div>
          `:""}

          <div class="note-actions">
            <button class="btn small danger"
              onclick="deleteNote('${n.id}')">삭제</button>
          </div>
        </div>
      `;
    }).join("");
}




// 좌석 선택 상태
let selectedSeat = null;
let currentSeatFloor = "1층";

// 층 전환
function setSeatFloor(floor){

  document.getElementById("seatFloor").value = floor;

// 좌석 선택 및 자동 저장
function selectSeat(floor, row, number){
  selectedSeat = {floor, row, number};

  document.getElementById("seatFloor").value = floor;
  document.getElementById("seatRow").value = row;
  document.getElementById("seatNumber").value = number;

let archiveSeatFloor = "1층";

// MY SEATS 층 전환

// 공통 좌석 배치 그리기


function createSeatMap(floor, mode="select"){
  const range=(start,end)=>
    Array.from({length:end-start+1},(_,i)=>i+start);

  const rows1=[
    [[8,9,10,11],[],[21,22,23,24]],
    [[6,7],range(8,24),[25,26]],
    [[6,7],range(8,24),[25,26]],
    [[5,6,7],range(8,24),[25,26,27]],
    [[5,6,7],range(8,24),[25,26,27]],
    [[4,5,6,7],range(8,24),[25,26,27,28]],
    [[4,5,6,7],range(8,24),[25,26,27,28]],
    [[3,4,5,6,7],range(8,24),[25,26,27,28,29]],
    [[2,3,4,5,6,7],range(8,24),[25,26,27,28,30]],
    [[2,3,4,5,6,7],range(8,24),[25,26,27,28,29,30]],
    [[1,2,3,4,5,6,7],range(8,24),[25,26,27,28,29,30,31]],
    [[1,2,3,4,5,6,7],range(8,24),range(25,31)],
    [[1,2,3,4,5,6,7],range(8,24),range(25,31)],
    [[1,2,3,4,5,6,7],[],range(25,31)]
  ];

  const rows2=[
    [range(3,8),range(9,24),range(25,31)],
    [range(3,8),range(9,24),range(25,31)],
    [range(2,8),range(9,24),range(25,32)],
    [range(1,8),range(9,24),range(25,33)],
    [range(1,8),range(9,24),range(25,33)]
  ];

  const rows=floor==="1층"?rows1:rows2;

  // 관극한 공연의 좌석별 이용 횟수 집계
  const seatCounts={};

  schedules.forEach(s=>{
    if(!s.watched || !s.seat) return;
    if(s.seat.floor!==floor) return;

    const row=String(s.seat.row);
    const number=String(s.seat.number);

    if(!row || !number) return;

    const key=`${row}-${number}`;
    seatCounts[key]=(seatCounts[key]||0)+1;
  });

  let html=floor==="1층"
    ? `<div class="seat-stage">STAGE</div>`
    : "";

  rows.forEach((blocks,index)=>{
    const row=String(index+1);

    const rowClass=floor==="1층" && index===0
      ? "seat-row first-row"
      : "seat-row";

    html+=`
      <div class="${rowClass}">
        <div class="seat-row-label">${index+1}열</div>
        <div class="seat-blocks">`;

    function makeSeatButtons(numbers){
      let seatHtml="";

      numbers.forEach(number=>{
        const key=`${row}-${String(number)}`;
        const count=seatCounts[key]||0;

        if(mode==="select"){
          const isSelected=selectedSeat&&
            selectedSeat.floor===floor&&
            String(selectedSeat.row)===row&&
            String(selectedSeat.number)===String(number);

          seatHtml+=`
            <button type="button"
              class="seat-cell ${isSelected?'selected':''}"
              onclick="selectSeat('${floor}','${row}','${number}')">
              ${number}
            </button>`;
        }else{
          seatHtml+=`
            <button type="button"
              class="seat-cell ${count>0?'selected has-count':''}"
              data-count="${count}"
              disabled
              title="${count}회 관극">
              ${number}
            </button>`;
        }
      });

      return seatHtml;
    }

    if(floor==="1층" && index===0){
      html+=`
        <div class="seat-block"></div>
        <div class="seat-block first-row-center">
          <div class="seat-center-pair">
            <div class="seat-group">
              ${makeSeatButtons(blocks[0])}
            </div>
            <div class="seat-group">
              ${makeSeatButtons(blocks[2])}
            </div>
          </div>
        </div>
        <div class="seat-block"></div>`;
    }else{
      blocks.forEach(block=>{
        html+=`
          <div class="seat-block">
            ${makeSeatButtons(block)}
          </div>`;
      });
    }

    html+=`</div></div>`;
  });

  return html;
}


// 일정별 좌석 선택표 - 1층과 2층 동시 표시
function renderSeatMap(){
  const map1=document.getElementById("seatMap1");
  const map2=document.getElementById("seatMap2");

  if(!map1||!map2)return;

  map1.innerHTML=createSeatMap("1층","select");
  map2.innerHTML=createSeatMap("2층","select");

  if(selectedSeat){
    document.getElementById("seatSelection").textContent=
      `${selectedSeat.floor} ${selectedSeat.row}열 ${selectedSeat.number}번 선택`;
  }else{
    document.getElementById("seatSelection").textContent=
      "좌석표에서 관람한 자리를 선택해 줘.";
  }
}

// MY SEATS 전체 관극 좌석표 - 1층과 2층 동시 표시
function renderArchiveSeatMap(){
  const map1=document.getElementById("archiveSeatMap1");
  const map2=document.getElementById("archiveSeatMap2");

  if(!map1||!map2)return;

function openSeatModal(id){
  activeScheduleId=id;

  const s=getSchedule(id);
  if(!s)return;

  document.getElementById("seatModalDate").textContent=
    formatDate(s.date)+" · "+(s.time||"");

  selectedSeat = s.seat ? {...s.seat} : null;

  document.getElementById("seatFloor").value=
    s.seat?.floor||"1층";

  document.getElementById("seatRow").value=
    s.seat?.row||"";

  document.getElementById("seatNumber").value=
    s.seat?.number||"";

  document.getElementById("seatModal").classList.add("show");

renderSeatMap();
}
function closeSeatModal(){
  document.getElementById("seatModal").classList.remove("show");
  activeScheduleId=null;
}

function saveSeat(){
  const s=getSchedule(activeScheduleId);
  if(!s)return;

  const row=document.getElementById("seatRow").value.trim();
  const number=document.getElementById("seatNumber").value.trim();
  const floor=document.getElementById("seatFloor").value;

  if(!row||!number){
    alert("관람한 좌석을 선택해 줘.");
    return;
  }

  // 좌석만 저장하고 관극 여부는 변경하지 않음
  s.seat={
    floor,
    row,
    number
  };

  saveAll();
  selectedSeat=null;
  closeSeatModal();
  render();
}


// 좌석 초기화
function resetSeat(){
  const s=getSchedule(activeScheduleId);
  if(!s)return;

  if(!confirm("이 회차의 좌석 기록을 초기화할까?"))return;

  s.seat=null;
  selectedSeat=null;

  document.getElementById("seatFloor").value="1층";
  document.getElementById("seatRow").value="";
  document.getElementById("seatNumber").value="";

  saveAll();
  renderSeatMap();
  render();
}

function addNote(){
  const scheduleId=document.getElementById("noteSchedule").value;
  const scene=document.getElementById("noteScene").value.trim();
  const memo=document.getElementById("noteMemo").value.trim();

  if(!scheduleId){
    alert("후기를 작성할 공연을 선택해 줘.");
    return;
  }

  if(!scene&&!memo){
    alert("기억하고 싶은 장면이나 감상을 입력해 줘.");
    return;
  }

  const existing=notes.find(n=>n.scheduleId===scheduleId);

  if(existing){
    existing.scene=scene;
    existing.memo=memo;
    existing.rating=noteRating;
    existing.created=Date.now();
  }else{
    notes.push({
      id:makeId(),
      scheduleId,
      scene,
      memo,
      rating:noteRating,
      created:Date.now()
    });
  }

  saveAll();
  renderNotes();

  document.getElementById("noteScene").value="";
  document.getElementById("noteMemo").value="";
  document.getElementById("noteSchedule").value="";

  noteRating=0;
  selectNoteRating(0);

  alert("감상이 저장됐어.");
}

function deleteNote(id){
  if(!confirm("이 후기를 삭제할까?"))return;
  notes=notes.filter(n=>n.id!==id);
  saveAll();
  renderNotes();
}

function exportData(){
  const data={
    project:"BROTHERS KARAMAZOV",
    version:1,
    schedules,
    notes
  };
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="brothers-karamazov-record.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.schedules)||!Array.isArray(data.notes)){
        throw new Error("형식이 올바르지 않습니다.");
      }
      if(!confirm("현재 기록을 가져온 파일의 기록으로 교체할까?"))return;
      schedules=data.schedules;
      notes=data.notes;
      saveAll();
      render();
      alert("기록을 불러왔어.");
    }catch(e){
      alert("파일을 읽을 수 없어. 백업 파일을 확인해 줘.");
    }
    event.target.value="";
  };
  reader.readAsText(file);
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
